<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spaced - Animație Universitară</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'VT323', monospace;
        }

        .space-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .typing-text {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: #00ff00;
            font-size: 48px;
            text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00;
            white-space: pre-line;
            text-align: center;
            line-height: 1.4;
            opacity: 0;
        }

        .typing-text.planet-text {
            bottom: 15%;
        }

        .typing-text.campus-text {
            top: 15%;
        }

        .typing-cursor {
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .planet-container {
            position: fixed;
            z-index: 5;
            filter: drop-shadow(0 0 80px rgba(100, 200, 255, 0.6));
        }

        .planet {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow:
                inset -30px -30px 80px rgba(0, 0, 0, 0.4),
                inset 20px 20px 40px rgba(255, 255, 255, 0.1);
        }

        .planet-surface {
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 30%, rgba(100, 200, 255, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 60% 70%, rgba(50, 150, 100, 0.6) 0%, transparent 40%),
                radial-gradient(circle at 80% 20%, rgba(150, 100, 200, 0.3) 0%, transparent 35%);
            background-color: #2a5a8a;
            position: relative;
        }

        .planet-continent {
            position: absolute;
            background: linear-gradient(135deg, #3d8f4d, #2a6b3a);
            border-radius: 50% 40% 45% 50%;
            opacity: 0.9;
        }

        .continent-1 {
            width: 40%;
            height: 35%;
            top: 20%;
            left: 15%;
            transform: rotate(25deg);
        }

        .continent-2 {
            width: 25%;
            height: 40%;
            top: 45%;
            right: 20%;
            transform: rotate(-15deg);
            border-radius: 40% 50% 50% 45%;
        }

        .continent-3 {
            width: 20%;
            height: 25%;
            top: 10%;
            right: 10%;
            transform: rotate(60deg);
        }

        .planet-clouds {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            filter: blur(8px);
        }

        .planet-atmosphere {
            position: absolute;
            width: 110%;
            height: 110%;
            top: -5%;
            left: -5%;
            border-radius: 50%;
            background: radial-gradient(circle, transparent 60%, rgba(100, 200, 255, 0.2) 100%);
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .shooting-star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px white;
        }

        /* CAMPUS SCENE */
        .campus-scene {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #0a0a1a 0%, #1a1a2e 50%, #2d1b3d 100%);
            z-index: 8;
            opacity: 0;
            pointer-events: none;
        }

        .campus-building {
            position: fixed;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%) perspective(1000px) rotateX(5deg);
            width: 800px;
            height: 500px;
            z-index: 9;
            transition: bottom 2.5s ease-out;
        }

        .building-main {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #1e2838 0%, #14202e 100%);
            position: relative;
            border-radius: 8px 8px 0 0;
            box-shadow:
                0 -5px 20px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border-left: 3px solid #2a3a4a;
            border-right: 3px solid #2a3a4a;
        }

        .building-detail {
            position: absolute;
            background: rgba(42, 58, 74, 0.5);
        }

        .pillar {
            width: 8px;
            height: 100%;
            top: 0;
        }

        .pillar-1 { left: 10%; }
        .pillar-2 { left: 30%; }
        .pillar-3 { left: 50%; }
        .pillar-4 { left: 70%; }
        .pillar-5 { left: 90%; }

        .balcony {
            height: 3px;
            width: 100%;
            left: 0;
            background: linear-gradient(to right, transparent 5%, #3a4a5a 50%, transparent 95%);
        }

        .balcony-1 { top: 16.66%; }
        .balcony-2 { top: 33.33%; }
        .balcony-3 { top: 50%; }
        .balcony-4 { top: 66.66%; }
        .balcony-5 { top: 83.33%; }

        .building-logo {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #2a4a6a, #1a2a3a);
            border-radius: 50%;
            border: 3px solid #3a5a7a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'VT323', monospace;
            font-size: 28px;
            color: #5a8aaa;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(90, 138, 170, 0.4);
        }

        .ventilation {
            position: absolute;
            width: 60px;
            height: 8px;
            background: repeating-linear-gradient(
                90deg,
                #0a1520 0px,
                #0a1520 4px,
                #2a3a4a 4px,
                #2a3a4a 8px
            );
            border-radius: 2px;
        }

        .vent-1 {
            top: 25%;
            left: 5%;
        }

        .vent-2 {
            top: 45%;
            right: 5%;
        }

        .vent-3 {
            top: 65%;
            left: 8%;
        }

        .satellite-dish {
            position: absolute;
            top: -15px;
            right: 20%;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, #3a4a5a 0%, #2a3a4a 70%);
            border-radius: 50%;
            border: 2px solid #4a5a6a;
            transform: rotateX(60deg);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.5);
        }

        .satellite-dish::after {
            content: '';
            position: absolute;
            width: 4px;
            height: 20px;
            background: #3a4a5a;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
        }

        .building-roof {
            position: absolute;
            top: -30px;
            left: -20px;
            right: -20px;
            height: 40px;
            background: linear-gradient(to bottom, #2a3a4a, #1e2838);
            clip-path: polygon(10% 100%, 0% 20%, 50% 0%, 100% 20%, 90% 100%);
        }

        .building-windows {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 20px;
            padding: 60px 40px;
            height: 100%;
        }

        .window {
            background: #0a1520;
            border: 2px solid #2a3a4a;
            border-radius: 4px;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
            transition: all 0.3s;
        }

        .window.lit {
            background: #ffeb3b;
            border-color: #fdd835;
            box-shadow:
                0 0 30px rgba(255, 235, 59, 0.8),
                0 0 50px rgba(255, 235, 59, 0.4),
                inset 0 0 20px rgba(255, 220, 0, 0.6);
            animation: flicker 4s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.95; }
            51% { opacity: 1; }
            52% { opacity: 0.97; }
        }

        .window-frame {
            position: absolute;
            width: 2px;
            height: 100%;
            background: rgba(42, 58, 74, 0.5);
            left: 50%;
            transform: translateX(-50%);
        }

        .window-frame-h {
            position: absolute;
            height: 2px;
            width: 100%;
            background: rgba(42, 58, 74, 0.5);
            top: 50%;
            transform: translateY(-50%);
        }

        .building-entrance {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 120px;
            background: linear-gradient(to bottom, #1a2a3a, #0a1520);
            border: 3px solid #2a3a4a;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
        }

        .building-sign {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #2a3a4a;
            padding: 8px 20px;
            border-radius: 4px;
            font-family: 'VT323', monospace;
            font-size: 14px;
            color: #5a7a9a;
            letter-spacing: 2px;
        }

        .ground {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(to bottom, rgba(20, 20, 30, 0.9), rgba(10, 10, 20, 1));
            z-index: 10;
            opacity: 0;
        }

        .campus-stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 7;
            opacity: 0;
        }

        /* MOON WITH ASTEROID RINGS */
        .moon-container {
            position: fixed;
            top: 8%;
            right: 8%;
            width: 320px;
            height: 320px;
            z-index: 11;
            opacity: 0;
            filter: drop-shadow(0 0 80px rgba(220, 220, 240, 0.8));
        }

        .moon {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background:
                radial-gradient(circle at 35% 35%, #ffffff, #d0d0e0);
            position: relative;
            box-shadow:
                inset -20px -20px 50px rgba(0, 0, 0, 0.3),
                inset 15px 15px 30px rgba(255, 255, 255, 0.3),
                0 0 60px rgba(255, 255, 255, 0.5);
        }

        .moon-crater {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(100, 100, 120, 0.3), rgba(80, 80, 100, 0.5));
            box-shadow: inset 2px 2px 8px rgba(0, 0, 0, 0.4);
        }

        .asteroid-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateX(70deg) rotateZ(20deg);
            transform-style: preserve-3d;
        }

        .ring-1 {
            width: 420px;
            height: 420px;
            border: 8px solid rgba(255, 220, 180, 0.95);
            border-radius: 50%;
            box-shadow:
                0 0 30px rgba(255, 220, 180, 0.9),
                inset 0 0 20px rgba(255, 220, 180, 0.5);
        }

        .ring-2 {
            width: 470px;
            height: 470px;
            border: 6px solid rgba(240, 200, 160, 0.9);
            border-radius: 50%;
            box-shadow:
                0 0 25px rgba(240, 200, 160, 0.8),
                inset 0 0 15px rgba(240, 200, 160, 0.4);
        }

        .asteroid {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #ffdd88;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 221, 136, 0.9);
        }

        /* FUTURISTIC BUILDINGS IN BACKGROUND */
        .bg-buildings {
            position: fixed;
            bottom: 100px;
            left: 0;
            width: 100%;
            height: 450px;
            z-index: 11;
            opacity: 0;
        }

        .bg-building {
            position: absolute;
            bottom: 0;
            background: linear-gradient(to top, #1a2535 0%, #2a3545 100%);
            border-radius: 6px 6px 0 0;
            opacity: 0.95;
            box-shadow: 0 0 30px rgba(100, 150, 200, 0.4);
            border-left: 1px solid rgba(100, 150, 200, 0.3);
            border-right: 1px solid rgba(100, 150, 200, 0.3);
        }

        .bg-building-1 {
            left: 2%;
            width: 140px;
            height: 320px;
        }

        .bg-building-2 {
            left: 9%;
            width: 110px;
            height: 260px;
        }

        .bg-building-3 {
            left: 15%;
            width: 120px;
            height: 300px;
        }

        .bg-building-4 {
            left: 21%;
            width: 95px;
            height: 240px;
        }

        .bg-building-5 {
            right: 21%;
            width: 105px;
            height: 270px;
        }

        .bg-building-6 {
            right: 15%;
            width: 115px;
            height: 310px;
        }

        .bg-building-7 {
            right: 9%;
            width: 120px;
            height: 280px;
        }

        .bg-building-8 {
            right: 2%;
            width: 150px;
            height: 340px;
        }

        .bg-window {
            position: absolute;
            width: 10px;
            height: 12px;
            background: rgba(150, 200, 255, 0.6);
            border-radius: 2px;
            border: 1px solid rgba(100, 150, 200, 0.4);
        }

        .bg-window.lit {
            background: rgba(150, 220, 255, 1);
            box-shadow: 0 0 12px rgba(150, 220, 255, 0.9);
            border-color: rgba(150, 220, 255, 0.8);
        }

        .building-antenna {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 25px;
            background: linear-gradient(to top, #3a4a5a, transparent);
        }

        .antenna-light {
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            background: #ff4444;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff4444;
            animation: blink-red 2s infinite;
        }

        @keyframes blink-red {
            0%, 49%, 100% { opacity: 1; }
            50%, 99% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <img src="space image.jpg" class="space-bg" id="spaceBg" alt="Space Background">

    <div class="stars" id="stars"></div>

    <div class="planet-container" id="planetContainer">
        <div class="planet">
            <div class="planet-atmosphere"></div>
            <div class="planet-surface">
                <div class="planet-continent continent-1"></div>
                <div class="planet-continent continent-2"></div>
                <div class="planet-continent continent-3"></div>
            </div>
            <div class="planet-clouds" id="planetClouds"></div>
        </div>
    </div>

    <div class="typing-text" id="typingText"></div>

    <!-- CAMPUS SCENE -->
    <div class="campus-scene" id="campusScene">
        <div class="campus-stars" id="campusStars"></div>
    </div>

    <!-- MOON WITH RINGS -->
    <div class="moon-container" id="moonContainer">
        <div class="asteroid-ring ring-2" id="ring2"></div>
        <div class="asteroid-ring ring-1" id="ring1"></div>
        <div class="moon" id="moon"></div>
    </div>

    <!-- BACKGROUND BUILDINGS -->
    <div class="bg-buildings" id="bgBuildings">
        <div class="bg-building bg-building-1" id="bgBuilding1">
            <div class="building-antenna">
                <div class="antenna-light"></div>
            </div>
        </div>
        <div class="bg-building bg-building-2" id="bgBuilding2"></div>
        <div class="bg-building bg-building-3" id="bgBuilding3">
            <div class="building-antenna">
                <div class="antenna-light"></div>
            </div>
        </div>
        <div class="bg-building bg-building-4" id="bgBuilding4"></div>
        <div class="bg-building bg-building-5" id="bgBuilding5">
            <div class="building-antenna">
                <div class="antenna-light"></div>
            </div>
        </div>
        <div class="bg-building bg-building-6" id="bgBuilding6"></div>
        <div class="bg-building bg-building-7" id="bgBuilding7">
            <div class="building-antenna">
                <div class="antenna-light"></div>
            </div>
        </div>
        <div class="bg-building bg-building-8" id="bgBuilding8">
            <div class="building-antenna">
                <div class="antenna-light"></div>
            </div>
        </div>
    </div>

    <div class="campus-building" id="campusBuilding">
        <div class="building-roof"></div>
        <div class="satellite-dish"></div>
        <div class="building-sign">UTM</div>
        <div class="building-main">
            <!-- Pillars -->
            <div class="building-detail pillar pillar-1"></div>
            <div class="building-detail pillar pillar-2"></div>
            <div class="building-detail pillar pillar-3"></div>
            <div class="building-detail pillar pillar-4"></div>
            <div class="building-detail pillar pillar-5"></div>

            <!-- Balconies -->
            <div class="building-detail balcony balcony-1"></div>
            <div class="building-detail balcony balcony-2"></div>
            <div class="building-detail balcony balcony-3"></div>
            <div class="building-detail balcony balcony-4"></div>
            <div class="building-detail balcony balcony-5"></div>

            <!-- Ventilation -->
            <div class="ventilation vent-1"></div>
            <div class="ventilation vent-2"></div>
            <div class="ventilation vent-3"></div>

            <!-- Logo -->
            <div class="building-logo">UTM</div>

            <div class="building-windows" id="buildingWindows"></div>
            <div class="building-entrance"></div>
        </div>
    </div>

    <div class="ground" id="ground"></div>

    <script>
        // Keyboard typing sounds (using Web Audio API)
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playKeySound() {
            // Mechanical keyboard sound
            const oscillator1 = audioContext.createOscillator();
            const oscillator2 = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            const filter = audioContext.createBiquadFilter();

            oscillator1.connect(filter);
            oscillator2.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioContext.destination);

            // Click sound
            oscillator1.frequency.value = 1200 + Math.random() * 400;
            oscillator1.type = 'triangle';

            // Clack sound
            oscillator2.frequency.value = 200 + Math.random() * 100;
            oscillator2.type = 'square';

            filter.type = 'bandpass';
            filter.frequency.value = 1000;

            const now = audioContext.currentTime;
            gainNode.gain.setValueAtTime(0.15, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05);

            oscillator1.start(now);
            oscillator1.stop(now + 0.05);
            oscillator2.start(now);
            oscillator2.stop(now + 0.05);
        }

        // Generate stars for space scene
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 200; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.width = star.style.height = Math.random() * 3 + 'px';
            star.style.animationDelay = Math.random() * 3 + 's';
            starsContainer.appendChild(star);
        }

        // Generate stars for campus scene
        const campusStarsContainer = document.getElementById('campusStars');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 60 + '%';
            star.style.width = star.style.height = Math.random() * 2.5 + 'px';
            star.style.animationDelay = Math.random() * 3 + 's';
            campusStarsContainer.appendChild(star);
        }

        // Generate clouds on planet
        const planetClouds = document.getElementById('planetClouds');
        for (let i = 0; i < 8; i++) {
            const cloud = document.createElement('div');
            cloud.className = 'cloud';
            cloud.style.left = Math.random() * 80 + '%';
            cloud.style.top = Math.random() * 80 + '%';
            cloud.style.width = Math.random() * 60 + 30 + 'px';
            cloud.style.height = Math.random() * 40 + 20 + 'px';
            planetClouds.appendChild(cloud);
        }

        // Generate moon craters
        const moon = document.getElementById('moon');
        const craterData = [
            { size: 30, top: 20, left: 25 },
            { size: 20, top: 45, left: 60 },
            { size: 25, top: 60, left: 30 },
            { size: 15, top: 30, left: 70 },
            { size: 18, top: 70, left: 50 }
        ];

        craterData.forEach(crater => {
            const craterEl = document.createElement('div');
            craterEl.className = 'moon-crater';
            craterEl.style.width = crater.size + 'px';
            craterEl.style.height = crater.size + 'px';
            craterEl.style.top = crater.top + '%';
            craterEl.style.left = crater.left + '%';
            moon.appendChild(craterEl);
        });

        // Generate asteroids on rings
        const ring1 = document.getElementById('ring1');
        const ring2 = document.getElementById('ring2');

        for (let i = 0; i < 20; i++) {
            const asteroid = document.createElement('div');
            asteroid.className = 'asteroid';
            const angle = (i / 20) * 360;
            const radius = 125;
            const x = Math.cos(angle * Math.PI / 180) * radius;
            const y = Math.sin(angle * Math.PI / 180) * radius * 0.3;
            asteroid.style.left = `calc(50% + ${x}px)`;
            asteroid.style.top = `calc(50% + ${y}px)`;
            ring1.appendChild(asteroid);
        }

        for (let i = 0; i < 25; i++) {
            const asteroid = document.createElement('div');
            asteroid.className = 'asteroid';
            const angle = (i / 25) * 360;
            const radius = 140;
            const x = Math.cos(angle * Math.PI / 180) * radius;
            const y = Math.sin(angle * Math.PI / 180) * radius * 0.3;
            asteroid.style.left = `calc(50% + ${x}px)`;
            asteroid.style.top = `calc(50% + ${y}px)`;
            asteroid.style.width = '3px';
            asteroid.style.height = '3px';
            ring2.appendChild(asteroid);
        }

        // Generate windows for background buildings
        const bgBuildingsData = [
            { id: 'bgBuilding1', cols: 4, rows: 10 },
            { id: 'bgBuilding2', cols: 3, rows: 8 },
            { id: 'bgBuilding3', cols: 3, rows: 9 },
            { id: 'bgBuilding4', cols: 3, rows: 7 },
            { id: 'bgBuilding5', cols: 3, rows: 8 },
            { id: 'bgBuilding6', cols: 3, rows: 9 },
            { id: 'bgBuilding7', cols: 3, rows: 8 },
            { id: 'bgBuilding8', cols: 4, rows: 11 }
        ];

        bgBuildingsData.forEach(building => {
            const buildingEl = document.getElementById(building.id);
            for (let row = 0; row < building.rows; row++) {
                for (let col = 0; col < building.cols; col++) {
                    const window = document.createElement('div');
                    window.className = 'bg-window';
                    if (Math.random() > 0.6) {
                        window.classList.add('lit');
                    }
                    window.style.left = (col + 1) * (100 / (building.cols + 1)) + '%';
                    window.style.bottom = (row + 1) * 18 + 'px';
                    buildingEl.appendChild(window);
                }
            }
        });

        // Generate building windows - middle window always lit
        const buildingWindows = document.getElementById('buildingWindows');
        const totalWindows = 48;
        const middleWindow = 27; // Middle row (4th of 6), middle column (4th of 8) = position 27

        for (let i = 0; i < totalWindows; i++) {
            const window = document.createElement('div');
            window.className = 'window';

            // Always light up the middle window
            if (i === middleWindow) {
                window.classList.add('lit');
            }

            const frameV = document.createElement('div');
            frameV.className = 'window-frame';
            const frameH = document.createElement('div');
            frameH.className = 'window-frame-h';

            window.appendChild(frameV);
            window.appendChild(frameH);
            buildingWindows.appendChild(window);
        }

        // Typing animation function with sound
        function typeText(element, text, speed = 80) {
            return new Promise((resolve) => {
                let index = 0;
                element.style.opacity = '1';

                function type() {
                    if (index < text.length) {
                        playKeySound();

                        if (text[index] === '\n') {
                            element.innerHTML += '<br>';
                        } else {
                            element.innerHTML += text[index];
                        }
                        element.innerHTML += '<span class="typing-cursor">_</span>';

                        setTimeout(() => {
                            element.innerHTML = element.innerHTML.replace('<span class="typing-cursor">_</span>', '');
                            index++;
                            type();
                        }, speed);
                    } else {
                        // Keep cursor blinking at the end
                        element.innerHTML += '<span class="typing-cursor">_</span>';
                        setTimeout(resolve, 500);
                    }
                }
                type();
            });
        }

        // Animation timeline
        async function animate() {
            const planetContainer = document.getElementById('planetContainer');
            const typingText = document.getElementById('typingText');
            const spaceBg = document.getElementById('spaceBg');
            const campusScene = document.getElementById('campusScene');
            const campusBuilding = document.getElementById('campusBuilding');
            const campusStars = document.getElementById('campusStars');
            const ground = document.getElementById('ground');
            const moonContainer = document.getElementById('moonContainer');
            const bgBuildings = document.getElementById('bgBuildings');

            // Scene 1: Planet Kepler (0-5s)
            planetContainer.style.top = '150%';
            planetContainer.style.left = '50%';
            planetContainer.style.transform = 'translate(-50%, -50%) scale(0.5)';
            planetContainer.style.transition = 'all 3s ease-out';

            setTimeout(() => {
                planetContainer.style.top = '35%';
                planetContainer.style.transform = 'translate(-50%, -50%) scale(1.8)';
            }, 100);

            await new Promise(resolve => setTimeout(resolve, 1500));

            typingText.className = 'typing-text planet-text';
            await typeText(typingText, 'Planeta Kepler\nAnul 3026', 60);

            await new Promise(resolve => setTimeout(resolve, 1000));

            // Fade out planet text
            typingText.style.transition = 'opacity 0.5s';
            typingText.style.opacity = '0';

            await new Promise(resolve => setTimeout(resolve, 600));
            typingText.innerHTML = '';

            // Scene 2: Campus (5-10s)
            // Fade out space background
            spaceBg.style.transition = 'opacity 1s';
            spaceBg.style.opacity = '0';

            campusScene.style.transition = 'opacity 1s';
            campusScene.style.opacity = '1';

            campusStars.style.transition = 'opacity 1s';
            campusStars.style.opacity = '1';

            planetContainer.style.transition = 'all 1.5s ease-in';
            planetContainer.style.top = '-50%';
            planetContainer.style.transform = 'translate(-50%, -50%) scale(0.5)';

            await new Promise(resolve => setTimeout(resolve, 800));

            // Campus, moon and buildings appear together
            campusBuilding.style.bottom = '100px';

            ground.style.transition = 'opacity 1s';
            ground.style.opacity = '1';

            moonContainer.style.transition = 'opacity 1.2s';
            moonContainer.style.opacity = '1';

            bgBuildings.style.transition = 'opacity 1.2s';
            bgBuildings.style.opacity = '1';

            await new Promise(resolve => setTimeout(resolve, 1800));

            typingText.className = 'typing-text campus-text';
            await typeText(typingText, 'Universitatea Tehnică din Mundus\nORA-> 03:36', 60);

            await new Promise(resolve => setTimeout(resolve, 1500));

            // Ready for next scene
            console.log('First 10 seconds complete! Ready for continuation...');
        }

        // Start animation when page loads
        window.addEventListener('load', () => {
            setTimeout(animate, 500);
        });

        // Add shooting stars periodically
        setInterval(() => {
            const shootingStar = document.createElement('div');
            shootingStar.className = 'shooting-star';
            shootingStar.style.left = Math.random() * 100 + '%';
            shootingStar.style.top = Math.random() * 50 + '%';

            const distance = 300;

            starsContainer.appendChild(shootingStar);

            shootingStar.animate([
                { transform: 'translate(0, 0)', opacity: 1 },
                { transform: `translate(${distance}px, ${distance}px)`, opacity: 0 }
            ], {
                duration: 1000,
                easing: 'ease-out'
            }).onfinish = () => shootingStar.remove();
        }, 3000);
    </script>
</body>
</html>
